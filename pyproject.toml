[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pinkeyeballs"
version = "0.1.0"
description = "Race DNS resolvers, then race the addresses they return, Happy-Eyeballs style"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "PinkEyeballs contributors" }]
keywords = ["dns", "happy-eyeballs", "asyncio", "networking", "res_mkquery"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
# The package talks to libc through ctypes; there is nothing to install.
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[project.scripts]
pinkeyeballs = "pinkeyeballs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pinkeyeballs"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
